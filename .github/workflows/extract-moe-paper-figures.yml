name: Extract original figures for MoE research notes
on:
  push:
    branches: [main]
    paths:
      - "scripts/extract_moe_paper_figures.py"
      - ".github/workflows/extract-moe-paper-figures.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image extraction dependencies
        run: python -m pip install requests beautifulsoup4 pillow pymupdf
      - name: Fetch and archive the original paper figures
        run: python scripts/extract_moe_paper_figures.py
      - name: Commit original figures into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/research/moe-paper-figures/
          git diff --cached --quiet && exit 0
          git commit -m "assets(research): archive selected original paper figures with attributions"
          git pull --rebase origin main
          git push origin HEAD:main
